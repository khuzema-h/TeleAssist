[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "teleassist"
version = "0.1.0"
description = "Cartesian teleop assistant for Franka in Isaac Lab"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy",
  "opencv-python-headless",
  "Pillow",
  "transformers>=4.46,<5",
]

[project.optional-dependencies]
perception = [
  "transformers>=4.46,<5",
]

[tool.setuptools.packages.find]
include = ["teleassist*"]
